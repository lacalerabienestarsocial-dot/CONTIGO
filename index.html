<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTIGO — La Calera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --green:#148246; --green-dark:#0e6537; --green-pale:#E7F3EB; --green-pale-2:#F2F8F4;
    --ink:#1C2622; --ink-soft:#5B6B62; --ink-faint:#8B9A92; --line:#DDE5DF; --bg:#F5F7F5; --surface:#FFFFFF;
    --blue:#3B5A78; --blue-pale:#EAF0F5; --amber:#B45309; --amber-pale:#FCEFDD;
    --red:#B3261E; --red-pale:#FBE7E5; --purple:#5B4B8A; --purple-pale:#EFEBF7;
    --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(28,38,34,0.06),0 1px 8px rgba(28,38,34,0.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}

  /* ---------- login ---------- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 32px;max-width:380px;width:100%;box-shadow:var(--shadow);}
  .login-mark{width:56px;height:56px;border-radius:14px;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .login-mark svg{width:30px;height:30px;}
  .login-card h1{text-align:center;font-size:22px;margin:0 0 4px;}
  .login-card p.tag{text-align:center;color:var(--ink-soft);font-size:13.5px;margin:0 0 24px;}
  .login-field{margin-bottom:14px;}
  .login-field label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-soft);margin-bottom:5px;}
  .login-field input{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;}
  .login-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px;font-size:14.5px;font-weight:650;cursor:pointer;margin-top:6px;}
  .login-btn:hover{background:var(--green-dark);}
  .login-err{color:var(--red);font-size:13px;margin-top:10px;text-align:center;display:none;}
  .login-err.show{display:block;}
  .login-test{margin-top:20px;padding:12px;background:var(--green-pale-2);border-radius:var(--radius-sm);font-size:12px;color:var(--ink-soft);line-height:1.6;}

  /* ---------- app shell ---------- */
  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;background:var(--surface);border-right:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;padding:18px 12px;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
  .sb-mark{width:34px;height:34px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sb-mark svg{width:18px;height:18px;}
  .sb-brand div h2{font-size:15px;margin:0;}
