<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTIGO — La Calera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --green:#148246; --green-dark:#0e6537; --green-pale:#E7F3EB; --green-pale-2:#F2F8F4;
    --ink:#1C2622; --ink-soft:#5B6B62; --ink-faint:#8B9A92; --line:#DDE5DF; --bg:#F5F7F5; --surface:#FFFFFF;
    --blue:#3B5A78; --blue-pale:#EAF0F5; --amber:#B45309; --amber-pale:#FCEFDD;
    --red:#B3261E; --red-pale:#FBE7E5; --purple:#5B4B8A; --purple-pale:#EFEBF7;
    --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(28,38,34,0.06),0 1px 8px rgba(28,38,34,0.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}

  /* ---------- login ---------- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 32px;max-width:380px;width:100%;box-shadow:var(--shadow);}
  .login-mark{width:56px;height:56px;border-radius:14px;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .login-mark svg{width:30px;height:30px;}
  .login-card h1{text-align:center;font-size:22px;margin:0 0 4px;}
  .login-card p.tag{text-align:center;color:var(--ink-soft);font-size:13.5px;margin:0 0 24px;}
  .login-field{margin-bottom:14px;}
  .login-field label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-soft);margin-bottom:5px;}
  .login-field input{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;}
  .login-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px;font-size:14.5px;font-weight:650;cursor:pointer;margin-top:6px;}
  .login-btn:hover{background:var(--green-dark);}
  .login-err{color:var(--red);font-size:13px;margin-top:10px;text-align:center;display:none;}
  .login-err.show{display:block;}
  .login-test{margin-top:20px;padding:12px;background:var(--green-pale-2);border-radius:var(--radius-sm);font-size:12px;color:var(--ink-soft);line-height:1.6;}

  /* ---------- app shell ---------- */
  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;background:var(--surface);border-right:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;padding:18px 12px;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
  .sb-mark{width:34px;height:34px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sb-mark svg{width:18px;height:18px;}
  .sb-brand div h2{font-size:15px;margin:0;}
  .sb-brand div p{font-size:11px;margin:0;color:var(--ink-soft);}
  .sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;}
  .sb-nav button{
    display:flex;align-items:center;gap:10px;text-align:left;background:none;border:none;border-radius:var(--radius-sm);
    padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;width:100%;
  }
  .sb-nav button:hover{background:var(--bg);}
  .sb-nav button.active{background:var(--green-pale);color:var(--green-dark);}
  .sb-nav .icon{width:18px;text-align:center;}
  .sb-user{border-top:1px solid var(--line);padding:12px 8px 4px;font-size:12.5px;color:var(--ink-soft);}
  .sb-user b{color:var(--ink);display:block;font-size:13px;}
  .sb-logout{background:none;border:none;color:var(--red);font-size:12.5px;font-weight:600;cursor:pointer;padding:8px;margin-top:4px;}

  .main{flex:1;min-width:0;padding:22px 28px 60px;overflow-x:hidden;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .topbar h1{font-size:19px;margin:0;}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:9px 14px;font-size:13.5px;font-weight:650;cursor:pointer;color:var(--ink);}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff;}
  .btn.primary:hover{background:var(--green-dark);}
  .btn.danger{border-color:var(--red);color:var(--red);}
  .btn:hover{background:var(--bg);}
  .btn.primary:hover{background:var(--green-dark);}

  .alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
  .alert{background:var(--amber-pale);border:1px solid var(--amber);color:#7A3B08;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .alert button{background:none;border:none;color:#7A3B08;font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:underline;white-space:nowrap;}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;}
  .card:hover{border-color:var(--green);}
  .card .n{font-size:24px;font-weight:750;line-height:1;}
  .card .l{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .card.dot-green .n{color:var(--green-dark);}
  .card.dot-amber .n{color:var(--amber);}
  .card.dot-red .n{color:var(--red);}
  .card.dot-blue .n{color:var(--blue);}

  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:10px;}
  .chart-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .chart-box h3{font-size:13.5px;margin:0 0 12px;color:var(--ink-soft);font-weight:650;}
  .chart-box canvas{max-height:220px;}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:8px 10px;font-size:13.5px;}
  .filters input[type="text"]{flex:1 1 180px;min-width:140px;}

  table.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  table.tbl th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:650;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--green-pale-2);}
  table.tbl td{padding:10px 12px;font-size:13.5px;border-bottom:1px solid var(--line);}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl tr.clickable:hover{background:var(--bg);cursor:pointer;}

  .badge{font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  .badge.b-green{background:var(--green-pale);color:var(--green-dark);}
  .badge.b-amber{background:var(--amber-pale);color:var(--amber);}
  .badge.b-blue{background:var(--blue-pale);color:var(--blue);}
  .badge.b-red{background:var(--red-pale);color:var(--red);}
  .badge.b-purple{background:var(--purple-pale);color:var(--purple);}
  .badge.b-gray{background:var(--bg);color:var(--ink-soft);}

  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .row-actions button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;}
  .row-actions button.ok{border-color:var(--green);color:var(--green-dark);}
  .row-actions button.bad{border-color:var(--red);color:var(--red);}
  .row-actions button.warn{border-color:var(--amber);color:var(--amber);}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 4px;}
  .panel .sub{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .kv{margin-bottom:10px;}
  .kv label{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:650;margin-bottom:2px;}
  .kv div{font-size:14px;}

  .overlay{position:fixed;inset:0;background:rgba(20,25,22,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);width:100%;max-width:500px;border-radius:16px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h2{font-size:16px;margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 10px;font-size:14px;font-family:inherit;}
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;padding:11px;border-radius:var(--radius-sm);font-size:14px;font-weight:650;border:1px solid var(--line);background:var(--surface);cursor:pointer;}
  .modal-actions button.primary{background:var(--green);border-color:var(--green);color:#fff;}
  .err{color:var(--red);font-size:12.5px;margin-top:8px;display:none;}
  .err.show{display:block;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;}
  .toast.show{opacity:1;}
  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);font-size:13.5px;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:650;cursor:pointer;color:var(--ink-soft);}
  .tabs button.active{background:var(--green);color:#fff;border-color:var(--green);}

  /* ---------- calendario ---------- */
  .cal-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .cal-nav{display:flex;align-items:center;gap:4px;}
  .cal-nav button{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--ink-soft);}
  .cal-nav button:hover{background:var(--bg);}
  .cal-label{font-size:14.5px;font-weight:650;min-width:170px;}
  .cal-grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);}
  .cal-grid{display:grid;min-width:560px;}
  .cal-headrow{display:grid;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line);}
  .cal-headcell{padding:10px 6px;text-align:center;font-size:12px;font-weight:650;color:var(--ink-soft);border-left:1px solid var(--line);}
  .cal-headcell.today{color:var(--green-dark);}
  .cal-headcell .dnum{font-size:15px;color:var(--ink);display:block;margin-top:2px;}
  .cal-headcell.today .dnum{color:var(--green-dark);}
  .cal-body{display:grid;position:relative;}
  .cal-timecol{display:flex;flex-direction:column;}
  .cal-timecell{height:52px;font-size:11px;color:var(--ink-faint);text-align:right;padding-right:6px;transform:translateY(-6px);border-top:1px solid transparent;}
  .cal-daycol{position:relative;border-left:1px solid var(--line);}
  .cal-hourline{height:52px;border-bottom:1px solid var(--line);}
  .cal-hourline:hover{background:var(--green-pale-2);cursor:pointer;}
  .cal-block{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.35;overflow:hidden;cursor:pointer;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.15);}
  .cal-block b{display:block;font-size:11.5px;}
  .cal-block:hover{filter:brightness(0.93);}
  .cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .cal-month .mh{background:var(--green-pale-2);padding:8px;text-align:center;font-size:11.5px;font-weight:650;color:var(--ink-soft);}
  .cal-month .md{background:var(--surface);min-height:78px;padding:6px;cursor:pointer;font-size:12.5px;}
  .cal-month .md:hover{background:var(--bg);}
  .cal-month .md.today{background:var(--green-pale-2);}
  .cal-month .md .dn{font-weight:650;margin-bottom:4px;}
  .cal-month .md .cnt{display:inline-block;background:var(--green);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:650;}
  .cal-legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 0;font-size:12px;color:var(--ink-soft);}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .cal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  @media(max-width:900px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .charts{grid-template-columns:1fr;}
    .grid2{grid-template-columns:1fr;}
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;align-items:center;padding:8px;}
    .sb-brand{padding:4px 10px;}
    .sb-nav{flex-direction:row;}
    .sb-user{display:none;}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s-7.5-4.6-10-9.3C.5 7.8 3 4 7 4c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 4 0 6.5 3.8 5 7.7C19.5 16.4 12 21 12 21z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
    <h1>CONTIGO</h1>
    <p class="tag">Un espacio para escucharte, acompañarte y brindarte apoyo.</p>
    <div class="login-field"><label>¿Quién eres?</label><select id="lgUsuario"><option value="">Cargando…</option></select></div>
    <button class="login-btn" id="btnLogin">Entrar</button>
    <div class="login-err" id="lgErr"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="sb-brand">
        <div class="sb-mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s-7.5-4.6-10-9.3C.5 7.8 3 4 7 4c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 4 0 6.5 3.8 5 7.7C19.5 16.4 12 21 12 21z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        <div><h2>CONTIGO</h2><p>La Calera</p></div>
      </div>
      <div class="sb-nav" id="sbNav"></div>
      <div class="sb-user">
        <b id="sbUserName"></b><span id="sbUserRole"></span>
        <button class="sb-logout" id="btnLogout">Cerrar sesión</button>
      </div>
    </div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

// ============================================================
// Pega aquí la URL de tu implementación de Google Apps Script
// ============================================================
var API_URL = "https://script.google.com/macros/s/AKfycbzR5yrik1QpjzpRav7O7gaUrltJ4sWL24SxjivFw7Bb88W3-Z0NBbq3uRr22l6d8Utliw/exec";

var $ = function(id){ return document.getElementById(id); };
var state = { token:null, usuario:null, view:'dashboard', viewParam:null };

function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2400);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

// ---------------- API ----------------
async function apiGet(action, params){
  params = params || {};
  params.action = action; params.token = state.token;
  var qs = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]==null?'':params[k]); }).join('&');
  var res = await fetch(API_URL + '?' + qs);
  return res.json();
}
async function apiPost(action, payload){
  payload = payload || {}; payload.token = state.token;
  var res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:action, payload:payload}) });
  return res.json();
}

function configurado(){ return API_URL && API_URL.indexOf('PEGA_AQUI')===-1; }

// ---------------- ESTADOS visuales ----------------
var ESTADO_BADGE = {
  'Solicitud recibida':'b-blue','Pendiente de programación':'b-amber','Programada':'b-blue',
  'Confirmada':'b-green','Reprogramación solicitada':'b-purple','Atendida':'b-green',
  'No asistió':'b-red','Cancelada':'b-gray','Seguimiento':'b-amber','Cerrada':'b-gray'
};
function estadoBadge(estado){
  var cls = ESTADO_BADGE[estado] || 'b-gray';
  return '<span class="badge '+cls+'">'+esc(estado)+'</span>';
}

// ---------------- LOGIN ----------------
async function cargarSelectorUsuarios(){
  if(!configurado()) return;
  try{
    var res = await fetch(API_URL + '?action=usuariosPublico');
    var data = await res.json();
    var sel = $('lgUsuario');
    if(data && data.ok && data.data.length){
      sel.innerHTML = data.data.map(function(u){
        return '<option value="'+u.id+'">'+esc(u.nombre)+' — '+(u.rol==='admin'?'Coordinadora':'Psicólogo(a)')+'</option>';
      }).join('');
    } else {
      sel.innerHTML = '<option value="">No hay cuentas creadas todavía</option>';
    }
  }catch(e){
    $('lgUsuario').innerHTML = '<option value="">Sin conexión con el servidor</option>';
  }
}

async function doLogin(){
  var usuarioId = $('lgUsuario').value;
  $('lgErr').classList.remove('show');
  if(!configurado()){
    $('lgErr').textContent = 'Falta configurar la conexión: edita este archivo y pega la URL de Apps Script en API_URL.';
    $('lgErr').classList.add('show'); return;
  }
  if(!usuarioId){ $('lgErr').textContent='Selecciona quién eres.'; $('lgErr').classList.add('show'); return; }
  try{
    var r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'entrar', payload:{usuarioId:usuarioId}}) });
    var data = await r.json();
    if(data && data.ok){
      state.token = data.token; state.usuario = data.usuario;
      localStorage.setItem('contigo_token', data.token);
      localStorage.setItem('contigo_usuario', JSON.stringify(data.usuario));
      showApp();
    } else {
      $('lgErr').textContent = (data && data.error) || 'No se pudo entrar.';
      $('lgErr').classList.add('show');
    }
  }catch(e){
    $('lgErr').textContent = 'Sin conexión con el servidor.';
    $('lgErr').classList.add('show');
  }
}

function doLogout(){
  apiPost('logout', {}).catch(function(){});
  localStorage.removeItem('contigo_token'); localStorage.removeItem('contigo_usuario');
  state.token=null; state.usuario=null;
  $('app').style.display='none'; $('loginScreen').style.display='flex';
}

// ---------------- MENÚS ----------------
var MENU_ADMIN = [
  {v:'dashboard', icon:'🏠', label:'Dashboard'},
  {v:'solicitudes', icon:'📋', label:'Solicitudes'},
  {v:'participantes', icon:'👥', label:'Participantes'},
  {v:'agenda', icon:'📅', label:'Agenda'},
  {v:'psicologos', icon:'🧠', label:'Psicólogos'},
  {v:'seguimiento', icon:'🔎', label:'Seguimiento'},
  {v:'reportes', icon:'📊', label:'Reportes'},
  {v:'configuracion', icon:'⚙️', label:'Configuración'}
];
var MENU_PSI = [
  {v:'dashboard', icon:'🏠', label:'Inicio'},
  {v:'agenda', icon:'📅', label:'Mi agenda'},
  {v:'pendientes', icon:'⏳', label:'Atenciones pendientes'},
  {v:'participantes', icon:'👥', label:'Mis participantes'},
  {v:'seguimiento', icon:'📋', label:'Historial'}
];

function renderSidebar(){
  var menu = MENU_ADMIN;
  $('sbNav').innerHTML = menu.map(function(m){
    return '<button data-view="'+m.v+'" class="'+(state.view===m.v?'active':'')+'"><span class="icon">'+m.icon+'</span>'+m.label+'</button>';
  }).join('');
  $('sbUserName').textContent = state.usuario.nombre;
  $('sbUserRole').textContent = state.usuario.rol==='admin' ? 'Coordinadora' : 'Psicólogo(a)';
}

function goto(view, param){
  state.view = view; state.viewParam = param || null;
  renderSidebar();
  render();
}

// ---------------- render dispatcher ----------------
async function render(){
  var area = $('mainArea');
  area.innerHTML = '<div class="empty">Cargando…</div>';
  try{
    if(state.view==='dashboard') return renderDashboard();
    if(state.view==='solicitudes') return renderSolicitudes();
    if(state.view==='participantes') return renderParticipantes();
    if(state.view==='participante-detalle') return renderParticipanteDetalle(state.viewParam);
    if(state.view==='agenda') return renderAgenda();
    if(state.view==='pendientes') return renderPendientes();
    if(state.view==='psicologos') return renderPsicologos();
    if(state.view==='seguimiento') return renderSeguimiento();
    if(state.view==='reportes') return renderReportes();
    if(state.view==='configuracion') return renderConfiguracion();
    area.innerHTML = '<div class="empty">Vista no encontrada.</div>';
  }catch(e){
    area.innerHTML = '<div class="empty">Ocurrió un error cargando esta vista. Intenta de nuevo.</div>';
  }
}

// ---------------- AGENDA ----------------
var PALETA_PSI = ['#148246','#3B5A78','#B45309','#5B4B8A','#B3261E','#0E7C86','#8A4B6B','#6B7A2F'];
function colorForPsicologo(id, psicologos){
  var idx = psicologos.findIndex(function(p){ return p.id===id; });
  if(idx<0) idx = 0;
  return PALETA_PSI[idx % PALETA_PSI.length];
}
function fmtYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function startOfWeekMonday(d){
  var x = new Date(d); var day = x.getDay(); var diff = (day===0?-6:1-day);
  x.setDate(x.getDate()+diff); x.setHours(0,0,0,0); return x;
}
function minutosDesde(horaStr, base){
  var p = (horaStr||'00:00').split(':'); return (parseInt(p[0],10)-base)*60 + parseInt(p[1]||'0',10);
}
var DIAS_CORTOS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var MESES_NOMBRE = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

var agendaState = { modo:'calendario', rango:'semana', fecha: new Date(), fpsi:'' };

async function renderAgenda(){
  var r = await apiGet('citas');
  var citas = r.data || [];
  var psicologos = (await apiGet('psicologos')).data || [];
  var psiById = {}; psicologos.forEach(function(p){psiById[p.id]=p.nombre;});

  var html = '<div class="topbar"><h1>Agenda</h1><button class="btn primary" id="btnNuevaCita">+ Nueva cita</button></div>';
  html += '<div class="cal-toolbar">'+
      '<div class="cal-nav"><button id="calPrev">‹</button><button id="calHoy" style="width:auto;padding:0 10px;">Hoy</button><button id="calNext">›</button></div>'+
      '<div class="cal-label" id="calLabel"></div>'+
      '<div class="tabs" id="tabsRango" style="margin:0;">'+
        '<button data-r="dia">Día</button><button data-r="semana">Semana</button><button data-r="mes">Mes</button><button data-r="todas">Todas</button>'+
      '</div>'+
      '<div class="tabs" id="tabsModo" style="margin:0;"><button data-m="calendario">Calendario</button><button data-m="lista">Lista</button></div>'+
      '<select id="fPsi" style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;"><option value="">Todos los psicólogos</option>'+psicologos.map(function(p){return '<option value="'+p.id+'">'+esc(p.nombre)+'</option>';}).join('')+'</select>'+
    '</div>';
  html += '<div id="agendaBox"></div>';
  html += '<div class="cal-legend">'+psicologos.map(function(p,i){ return '<span><i style="background:'+PALETA_PSI[i%PALETA_PSI.length]+';"></i>'+esc(p.nombre)+'</span>'; }).join('')+'</div>';
  $('mainArea').innerHTML = html;

  document.querySelector('#tabsRango [data-r="'+agendaState.rango+'"]').classList.add('active');
  document.querySelector('#tabsModo [data-m="'+agendaState.modo+'"]').classList.add('active');
  $('fPsi').value = agendaState.fpsi;

  function citasEnDia(fechaYmd, fpsi){
    return citas.filter(function(c){ return c.fecha===fechaYmd && (!fpsi || c.psicologoId===fpsi); });
  }

  function draw(){
    var fpsi = $('fPsi').value; agendaState.fpsi = fpsi;
    var rango = agendaState.rango;

    if(rango==='todas'){ return drawLista(citas.filter(function(c){return !fpsi||c.psicologoId===fpsi;})); }
    if(rango==='mes'){ return drawMes(fpsi); }
    if(rango==='dia'){ return drawCalendario([new Date(agendaState.fecha)], fpsi); }
    var lunes = startOfWeekMonday(agendaState.fecha);
    var dias = []; for(var i=0;i<7;i++){ var d=new Date(lunes); d.setDate(d.getDate()+i); dias.push(d); }
    return drawCalendario(dias, fpsi);
  }

  function actualizarLabel(){
    if(agendaState.rango==='dia'){
      $('calLabel').textContent = DIAS_CORTOS[agendaState.fecha.getDay()]+' '+agendaState.fecha.getDate()+' de '+MESES_NOMBRE[agendaState.fecha.getMonth()];
    } else if(agendaState.rango==='mes'){
      $('calLabel').textContent = MESES_NOMBRE[agendaState.fecha.getMonth()]+' de '+agendaState.fecha.getFullYear();
    } else if(agendaState.rango==='semana'){
      var lunes = startOfWeekMonday(agendaState.fecha); var dom = new Date(lunes); dom.setDate(dom.getDate()+6);
      $('calLabel').textContent = lunes.getDate()+' — '+dom.getDate()+' de '+MESES_NOMBRE[dom.getMonth()];
    } else {
      $('calLabel').textContent = 'Todas las citas';
    }
  }

  function drawCalendario(dias, fpsi){
    if(agendaState.modo==='lista'){ return drawLista(citas.filter(function(c){ return dias.some(function(d){return fmtYmd(d)===c.fecha;}) && (!fpsi||c.psicologoId===fpsi); })); }
    var HORA_INI=7, HORA_FIN=20;
    var horas = []; for(var h=HORA_INI; h<=HORA_FIN; h++) horas.push(h);
    var hoyYmd = fmtYmd(new Date());
    var gridCols = '56px repeat('+dias.length+', minmax(120px,1fr))';
    var head = '<div class="cal-headrow" style="grid-template-columns:'+gridCols+';"><div></div>'+
      dias.map(function(d){
        var esHoy = fmtYmd(d)===hoyYmd;
        return '<div class="cal-headcell'+(esHoy?' today':'')+'">'+DIAS_CORTOS[d.getDay()]+'<span class="dnum">'+d.getDate()+'</span></div>';
      }).join('')+'</div>';

    var body = '<div class="cal-body" style="grid-template-columns:'+gridCols+';">'+
      '<div class="cal-timecol">'+horas.map(function(h){ return '<div class="cal-timecell">'+String(h).padStart(2,'0')+':00</div>'; }).join('')+'</div>'+
      dias.map(function(d){
        var ymd = fmtYmd(d);
        var colHtml = horas.map(function(h){ return '<div class="cal-hourline" data-fecha="'+ymd+'" data-hora="'+String(h).padStart(2,'0')+':00"></div>'; }).join('');
        var bloques = citasEnDia(ymd, fpsi).map(function(c){
          var top = minutosDesde(c.horaInicio, HORA_INI) * (52/60);
          var dur = Math.max(24, (minutosDesde(c.horaFin,HORA_INI)-minutosDesde(c.horaInicio,HORA_INI)) * (52/60));
          var color = colorForPsicologo(c.psicologoId, psicologos);
          var opac = (c.estado==='Cancelada'||c.estado==='No asistió') ? 0.45 : 1;
          return '<div class="cal-block" data-vercita="'+c.id+'" style="top:'+top+'px;height:'+dur+'px;background:'+color+';opacity:'+opac+';">'+
            '<b>'+esc(c.horaInicio)+' '+esc(c.participanteNombre||'')+'</b>'+esc(c.estado)+'</div>';
        }).join('');
        return '<div class="cal-daycol">'+colHtml+bloques+'</div>';
      }).join('') +
    '</div>';

    $('agendaBox').innerHTML = '<div class="cal-grid-wrap"><div class="cal-grid">'+head+body+'</div></div>';
    $('agendaBox').querySelectorAll('[data-vercita]').forEach(function(el){
      el.addEventListener('click', function(ev){ ev.stopPropagation(); verCitaDetalle(el.getAttribute('data-vercita'), citas, psiById); });
    });
    $('agendaBox').querySelectorAll('.cal-hourline').forEach(function(el){
      el.addEventListener('click', function(){ abrirModalNuevaCita(el.getAttribute('data-fecha'), el.getAttribute('data-hora')); });
    });
  }

  function drawMes(fpsi){
    var anchor = agendaState.fecha;
    var primerDiaMes = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    var inicioGrid = startOfWeekMonday(primerDiaMes);
    var hoyYmd = fmtYmd(new Date());
    var celdas = [];
    for(var i=0;i<42;i++){ var d=new Date(inicioGrid); d.setDate(d.getDate()+i); celdas.push(d); }
    var html = '<div class="cal-month">'+DIAS_CORTOS.slice(1).concat(DIAS_CORTOS[0]).map(function(n){return '<div class="mh">'+n+'</div>';}).join('');
    celdas.forEach(function(d){
      var ymd = fmtYmd(d);
      var n = citasEnDia(ymd, fpsi).length;
      var fueraMes = d.getMonth()!==anchor.getMonth();
      html += '<div class="md'+(ymd===hoyYmd?' today':'')+'" data-dia="'+ymd+'" style="opacity:'+(fueraMes?0.4:1)+';">'+
        '<div class="dn">'+d.getDate()+'</div>'+(n?'<span class="cnt">'+n+'</span>':'')+'</div>';
    });
    html += '</div>';
    $('agendaBox').innerHTML = html;
    $('agendaBox').querySelectorAll('[data-dia]').forEach(function(el){
      el.addEventListener('click', function(){
        agendaState.fecha = new Date(el.getAttribute('data-dia')+'T00:00:00');
        agendaState.rango = 'dia';
        document.querySelectorAll('#tabsRango button').forEach(function(b){b.classList.remove('active');});
        document.querySelector('#tabsRango [data-r="dia"]').classList.add('active');
        actualizarLabel(); draw();
      });
    });
  }

  function drawLista(rows){
    rows = rows.slice().sort(function(a,b){ return (a.fecha+a.horaInicio) < (b.fecha+b.horaInicio) ? -1 : 1; });
    var box = $('agendaBox');
    if(!rows.length){ box.innerHTML = '<div class="empty">No hay citas en este rango.</div>'; return; }
    box.innerHTML = '<table class="tbl"><thead><tr><th>Fecha</th><th>Hora</th><th>Participante</th><th>Psicólogo</th><th>Modalidad</th><th>Estado</th><th></th></tr></thead><tbody>'+
      rows.map(function(c){
        var acciones = '<div class="row-actions">';
        if(c.estado==='Programada') acciones += '<button class="ok" data-confirmar="'+c.id+'">Confirmar</button>';
        if(['Programada','Confirmada'].indexOf(c.estado)>-1){
          acciones += '<button class="ok" data-atender="'+c.id+'|atendida">Atendida</button>';
          acciones += '<button class="bad" data-atender="'+c.id+'|no">No asistió</button>';
        }
        if(['Programada','Confirmada','Reprogramación solicitada'].indexOf(c.estado)>-1){
          acciones += '<button class="warn" data-repro="'+c.id+'">Reprogramar</button>';
          acciones += '<button class="bad" data-cancelar="'+c.id+'">Cancelar</button>';
        }
        acciones += '</div>';
        return '<tr><td>'+esc(c.fecha)+'</td><td>'+esc(c.horaInicio)+'-'+esc(c.horaFin)+'</td><td>'+esc(c.participanteNombre||'')+'</td>'+
          '<td>'+esc(psiById[c.psicologoId]||'')+'</td>'+
          '<td>'+esc(c.modalidad)+'</td><td>'+estadoBadge(c.estado)+'</td><td>'+acciones+'</td></tr>';
      }).join('') + '</tbody></table>';

    box.querySelectorAll('[data-confirmar]').forEach(function(b){ b.addEventListener('click', async function(){ var r=await apiPost('confirmarCita',{citaId:b.getAttribute('data-confirmar')}); if(r.ok){toast('Cita confirmada'); renderAgenda();} else toast(r.error); }); });
    box.querySelectorAll('[data-cancelar]').forEach(function(b){ b.addEventListener('click', async function(){ if(!confirm('¿Cancelar esta cita?'))return; var r=await apiPost('cancelarCita',{citaId:b.getAttribute('data-cancelar')}); if(r.ok){toast('Cita cancelada'); renderAgenda();} else toast(r.error); }); });
    box.querySelectorAll('[data-repro]').forEach(function(b){ b.addEventListener('click', function(){ abrirModalReprogramar(b.getAttribute('data-repro')); }); });
    box.querySelectorAll('[data-atender]').forEach(function(b){ b.addEventListener('click', function(){
      var parts = b.getAttribute('data-atender').split('|');
      abrirModalAtencion(parts[0], parts[1]==='atendida'?'atendida':'no_atendida');
    }); });
  }

  document.querySelectorAll('#tabsRango button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#tabsRango button').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active'); agendaState.rango = btn.getAttribute('data-r');
      actualizarLabel(); draw();
    });
  });
  document.querySelectorAll('#tabsModo button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#tabsModo button').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active'); agendaState.modo = btn.getAttribute('data-m');
      draw();
    });
  });
  $('calPrev').addEventListener('click', function(){ moverFecha(-1); });
  $('calNext').addEventListener('click', function(){ moverFecha(1); });
  $('calHoy').addEventListener('click', function(){ agendaState.fecha = new Date(); actualizarLabel(); draw(); });
  function moverFecha(dir){
    var d = new Date(agendaState.fecha);
    if(agendaState.rango==='dia') d.setDate(d.getDate()+dir);
    else if(agendaState.rango==='mes') d.setMonth(d.getMonth()+dir);
    else d.setDate(d.getDate()+dir*7);
    agendaState.fecha = d; actualizarLabel(); draw();
  }
  $('fPsi').addEventListener('change', draw);
  $('btnNuevaCita').addEventListener('click', function(){ abrirModalNuevaCita(); });
  actualizarLabel();
  draw();
}

function verCitaDetalle(citaId, citas, psiById){
  var c = citas.filter(function(x){return x.id===citaId;})[0];
  if(!c) return;
  var body = document.createElement('div');
  var acciones = '';
  if(c.estado==='Programada') acciones += '<button class="btn" style="border-color:var(--green);color:var(--green-dark);" data-confirmar>Confirmar</button>';
  if(['Programada','Confirmada'].indexOf(c.estado)>-1){
    acciones += '<button class="btn" style="border-color:var(--green);color:var(--green-dark);" data-atender="atendida">Atendida</button>';
    acciones += '<button class="btn danger" data-atender="no">No asistió</button>';
  }
  if(['Programada','Confirmada','Reprogramación solicitada'].indexOf(c.estado)>-1){
    acciones += '<button class="btn" style="border-color:var(--amber);color:var(--amber);" data-repro>Reprogramar</button>';
    acciones += '<button class="btn danger" data-cancelar>Cancelar</button>';
  }
  body.innerHTML = '<div class="overlay open"><div class="modal" style="max-width:380px;">'+
    '<h2>'+esc(c.participanteNombre||'')+'</h2>'+
    '<p class="sub" style="margin:-6px 0 14px;">'+esc(c.fecha)+' · '+esc(c.horaInicio)+'-'+esc(c.horaFin)+' · '+esc(psiById[c.psicologoId]||'')+'</p>'+
    '<p style="margin:0 0 14px;">'+estadoBadge(c.estado)+'</p>'+
    (c.observacion ? '<p style="font-size:13px;color:var(--ink-soft);margin:0 0 14px;">'+esc(c.observacion)+'</p>' : '')+
    '<div class="row-actions" style="margin-bottom:14px;">'+acciones+'</div>'+
    '<div class="modal-actions"><button id="vdCerrar">Cerrar</button></div>'+
  '</div></div>';
  document.body.appendChild(body);
  body.querySelector('#vdCerrar').addEventListener('click', function(){ body.remove(); });
  if(body.querySelector('[data-confirmar]')) body.querySelector('[data-confirmar]').addEventListener('click', async function(){ var r=await apiPost('confirmarCita',{citaId:c.id}); body.remove(); if(r.ok){toast('Cita confirmada'); renderAgenda();} else toast(r.error); });
  if(body.querySelector('[data-cancelar]')) body.querySelector('[data-cancelar]').addEventListener('click', async function(){ if(!confirm('¿Cancelar esta cita?')){return;} var r=await apiPost('cancelarCita',{citaId:c.id}); body.remove(); if(r.ok){toast('Cita cancelada'); renderAgenda();} else toast(r.error); });
  if(body.querySelector('[data-repro]')) body.querySelector('[data-repro]').addEventListener('click', function(){ body.remove(); abrirModalReprogramar(c.id); });
  body.querySelectorAll('[data-atender]').forEach(function(b){ b.addEventListener('click', function(){ body.remove(); abrirModalAtencion(c.id, b.getAttribute('data-atender')==='atendida'?'atendida':'no_atendida'); }); });
}

  html += '<div id="repTabla"></div>';
  $('mainArea').innerHTML = html;

  var ultimaData = [];
  async function cargar(){
    var params = { desde:$('repDesde').value, hasta:$('repHasta').value, psicologoId:$('repPsi').value, estado:$('repEstado').value, sede:$('repSede').value, tipoParticipante:$('repTipo').value };
    var r = await apiGet('reportes', params);

    ultimaData = r.data.citas;

    var noAsist = ultimaData.filter(function(c){return c.estado==='No asistió';}).length;
    var cancel = ultimaData.filter(function(c){return c.estado==='Cancelada';}).length;
    $('repCards').innerHTML =
      '<div class="card dot-blue"><div class="n">'+ultimaData.length+'</div><div class="l">Total de citas</div></div>'+
      '<div class="card dot-green"><div class="n">'+atendidas+'</div><div class="l">Atendidas</div></div>'+

      ultimaData.map(function(c){ return '<tr><td>'+esc(c.fecha)+'</td><td>'+esc(c.participanteNombre)+'</td><td>'+esc(c.sede)+'</td><td>'+esc(c.tipoParticipante)+'</td><td>'+estadoBadge(c.estado)+'</td></tr>'; }).join('')+
      '</tbody></table>';
  }
  $('btnFiltrar').addEventListener('click', cargar);
  $('btnExportar').addEventListener('click', function(){
    if(!ultimaData.length){ toast('No hay datos para exportar.'); return; }
    var headers = ['Fecha','Participante','Sede','Tipo','Estado'];
    var lines = [headers.join(',')].concat(ultimaData.map(function(c){
      return [c.fecha,c.participanteNombre,c.sede,c.tipoParticipante,c.estado].map(function(v){ return '"'+String(v||'').replace(/"/g,'""')+'"'; }).join(',');
    }));
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reporte_contigo.csv'; a.click();
  });
  cargar();
}

// ---------------- CONFIGURACIÓN (admin) ----------------
async function renderConfiguracion(){
  var html = '<div class="topbar"><h1>Configuración</h1></div>';
  html += '<div class="panel"><h2>Importar participantes desde Excel</h2><p class="sub">Columnas esperadas: Nombre, DNI, Tipo de participante, Sede, Teléfono, Correo.</p>'+
    '<input type="file" id="impFile" accept=".xlsx,.xls,.csv"><div id="impResultado" style="margin-top:12px;font-size:13.5px;"></div></div>';
  $('mainArea').innerHTML = html;
  $('impFile').addEventListener('change', function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(ev){
      try{
        var wb = XLSX.read(ev.target.result, {type:'array'});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var json = XLSX.utils.sheet_to_json(sheet, {defval:''});
        var filas = json.map(function(row){
          return {
            nombre: row['Nombre']||row['nombre']||'',
            documento: String(row['DNI']||row['dni']||row['Documento']||'').trim(),
            tipoParticipante: row['Tipo de participante']||row['tipoParticipante']||'Colaborador La Calera',
            sede: row['Sede']||row['sede']||'',
            telefono: row['Teléfono']||row['Telefono']||row['telefono']||'',
            correo: row['Correo']||row['correo']||''
          };
        });
        var r = await apiPost('importarParticipantes', {filas:filas});
        if(!r.ok){ $('impResultado').textContent = r.error||'Error al importar.'; return; }
        $('impResultado').innerHTML = 'Creados: '+r.resultado.creados+' · Duplicados (DNI ya existente): '+r.resultado.duplicados+' · Incompletos: '+r.resultado.incompletos;
      }catch(err){ $('impResultado').textContent = 'No se pudo leer el archivo.'; }
    };
    reader.readAsArrayBuffer(file);
  });
}

function showApp(){
  $('loginScreen').style.display='none'; $('app').style.display='block';
  renderSidebar(); goto('dashboard');
}

document.addEventListener('click', function(e){
  if(e.target.closest('#sbNav button')){ goto(e.target.closest('button').getAttribute('data-view')); }
});
$('btnLogin').addEventListener('click', doLogin);
$('btnLogout').addEventListener('click', doLogout);

(function boot(){
  var savedToken = localStorage.getItem('contigo_token');
  var savedUser = localStorage.getItem('contigo_usuario');
  if(savedToken && savedUser){
    state.token = savedToken; state.usuario = JSON.parse(savedUser);
    showApp();
  } else {
    cargarSelectorUsuarios();
  }
})();

})();
